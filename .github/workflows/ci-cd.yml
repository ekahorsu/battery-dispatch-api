name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

env:
  SERVICE: battery-dispatch-api
  REGION: us-west1
  PROJECT_ID: project-4812e5c4-3a75-4314-8c3
  WIF_PROVIDER: projects/209645576722/locations/global/workloadIdentityPools/github/providers/github-provider
  DEPLOY_SA: github-deployer@project-4812e5c4-3a75-4314-8c3.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v
      - name: Build Docker image
        run: docker build -t $SERVICE .
      - name: Smoke-test the container
        run: |
          docker run -d -p 8080:8080 --name api $SERVICE
          for i in $(seq 1 20); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -X POST localhost:8080/dispatch/compare -H "Content-Type: application/json" -d @examples/sample_request.json

  deploy:
    # Deploy only from main, after the tests pass. GitHub signs in to Google Cloud with
    # Workload Identity Federation (short-lived OIDC tokens), so no service account key is stored.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --source . \
            --project $PROJECT_ID \
            --region $REGION \
            --allow-unauthenticated \
            --max-instances 2 \
            --memory 512Mi \
            --quiet
      - name: Check the live service
        run: |
          URL=$(gcloud run services describe $SERVICE --project $PROJECT_ID --region $REGION --format 'value(status.url)')
          echo "Service URL: $URL"
          curl -sf "$URL/health"
